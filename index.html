<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Czas pracy</title>
<link rel="manifest" href="manifest.json">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Czas pracy">
<meta name="mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">

<style>
:root { --blue: #00eaff; --green: #00ffa6; --orange: #ff9900; --red: #ff1a1a; --bg: #0b0f14; --panel: #1a242d; }
html, body { height: 100%; margin: 0; padding: 0; background: var(--bg); overflow: hidden; }
body { color: white; font-family: Arial; display: flex; flex-direction: column; padding: 10px 10px calc(10px + env(safe-area-inset-bottom)) 10px; box-sizing: border-box; }
.container { max-width: 480px; width: 100%; margin: 0 auto; display: flex; flex-direction: column; height: 100%; position: relative; }

/* USUNIĘCIE STRZĘPKÓW SYSTEMOWEGO PODŚWIETLENIA I BLOKADA ZAZNACZANIA */
* { -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; }
input, textarea { -webkit-user-select: text; user-select: text; }

/* NOWOCZESNE POWIADOMIENIA TOAST */
.toast-container { position: fixed; bottom: calc(20px + env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%) translateY(100px); background: #111a22; border: 1px solid var(--blue); color: white; padding: 12px 24px; border-radius: 30px; font-size: 13px; font-weight: bold; z-index: 9999; box-shadow: 0 10px 30px rgba(0,0,0,0.5); pointer-events: none; opacity: 0; transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s ease; display: flex; align-items: center; gap: 8px; }
.toast-container.show { transform: translateX(-50%) translateY(0); opacity: 1; }
.toast-container.toast-success { border-color: var(--green); color: var(--green); }
.toast-container.toast-error { border-color: var(--red); color: var(--red); }

/* NAGŁÓWEK */
.header { margin-bottom: 10px; flex-shrink: 0; text-align: center; padding-top: 5px; }
#dayLabel { font-size: 15px; color: var(--blue); text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 2px; font-weight: bold; }
.clock { font-size: 42px; color: var(--blue); text-shadow: 0 0 15px var(--blue); line-height: 1; margin: 5px 0; }

/* KONTENER TYTUŁU MIESIĄCA Z BLOKADĄ ROZJEŻDŻANIA */
.month-title-container { display: flex; align-items: center; justify-content: center; gap: 10px; margin: 8px 0 5px 0; height: 30px; }
#monthTitle { font-size: 20px; color: var(--blue); font-weight: bold; text-transform: uppercase; margin: 0; }

#weather-info { text-align: center; font-size: 12px; color: var(--blue); margin-bottom: 8px; min-height: 18px; letter-spacing: 0.5px; }

.progress-container { width: 100%; height: 8px; background: rgba(255,255,255,0.1); border-radius: 4px; margin: 8px 0; overflow: hidden; }
#progress-bar { width: 0%; height: 100%; background: var(--blue); box-shadow: 0 0 10px var(--blue); transition: width 0.5s; }
.todayWork { font-size: 16px; color: var(--green); font-weight: bold; }
.break-timer { font-size: 14px; margin-top: 4px; color: var(--orange); font-weight: bold; min-height: 18px; height: 18px; }

/* TABELA */
.table-wrapper { flex: 1 1 auto; overflow-y: auto; border: 1px solid #333; border-radius: 8px; background: #111a22; margin-bottom: 10px; scroll-behavior: smooth; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { position: sticky; top: 0; background: var(--panel); color: var(--blue); padding: 12px 5px; z-index: 2; border-bottom: 2px solid #333; text-transform: uppercase; font-size: 11px; }
td { padding: 12px 5px; border-bottom: 1px solid #333; text-align: center; vertical-align: middle; }

/* KONTENER DNIA POŁĄCZONY W JEDNĄ STRUKTURĘ DLA IDEALNEGO WYŚRODKOWANIA DYMKA */
.date-row-container { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; height: 22px; }
.date-num { font-weight: bold; width: 22px; text-align: right; }
.date-day-name { width: 32px; text-align: left; }

.saturday { color: var(--blue); }
.sunday { color: var(--red); }

.today { background: rgba(255, 153, 0, 0.15) !important; color: var(--orange) !important; font-weight: bold; }
.dayOff { opacity: 0.3; text-decoration: line-through; }
.weekSummary { background: rgba(0,0,0,0.4); color: var(--green); font-weight: bold; font-size: 12px; }

/* STYL I AKTYWNA ANIMACJA IKONY SUWAKÓW */
.font-sliders-icon {
    width: 22px;
    height: 22px;
    cursor: pointer;
    display: block;
    margin: 0 auto;
    fill: none;
}
.font-sliders-icon .slider-track { stroke: #ffffff; opacity: 0.4; transition: stroke 0.2s, opacity 0.2s; }
.font-sliders-icon .slider-dot { 
    fill: #ffffff; 
    transition: transform 0.18s cubic-bezier(0.25, 1, 0.5, 1), fill 0.18s; 
}

/* Kolory ikon dla Sobót i Niedziel */
.saturday .font-sliders-icon .slider-track { stroke: var(--blue); }
.saturday .font-sliders-icon .slider-dot { fill: var(--blue); }
.sunday .font-sliders-icon .slider-track { stroke: var(--red); }
.sunday .font-sliders-icon .slider-dot { fill: var(--red); }

/* STYL APLESKANY PO NACIŚNIĘCIU (DODAWANY PRZEZ JS) */
.font-sliders-icon.animating .slider-track { opacity: 0.8; }
.font-sliders-icon.animating .slider-dot { filter: drop-shadow(0 0 5px rgba(255,255,255,0.6)); }

/* Górny suwak jedzie w lewo (-5px) */
.font-sliders-icon.animating .line-top { transform: translateX(-5px); fill: var(--blue) !important; }
/* Środkowy suwak jedzie w prawo (+5px) */
.font-sliders-icon.animating .line-mid { transform: translateX(5px); fill: var(--green) !important; }
/* Dolny suwak jedzie w lewo (-5px) */
.font-sliders-icon.animating .line-bot { transform: translateX(-5px); fill: var(--blue) !important; }

/* NOWY, POWIĘKSZONY NEONOWY DYMEK UMIESZCZONY CENTRALNIE */
.neon-bubble-svg { 
    width: 20px; 
    height: 17px; 
    filter: drop-shadow(0 0 4px var(--orange)); 
    cursor: help; 
    flex-shrink: 0;
    transition: transform 0.1s ease, filter 0.1s ease;
}

/* ROZBUDOWANY EFEKT PULSOWANIA I NEONU PRZY KLIKNIĘCIU W DYMEK */
.neon-bubble-svg:active {
    transform: scale(1.3);
    filter: drop-shadow(0 0 10px var(--orange)) brightness(1.3);
}

/* GLOBALNY KONTENER NA IKONĘ OBOK TEKSTU W NAGŁÓWKU */
.global-bubble-wrapper {
    display: none;
    align-items: center;
    gap: 6px;
}

/* GLOBALNA IKONA IDENTYCZNA Z TĄ Z TABELI */
.global-bubble-svg {
    width: 16px;
    height: 14px;
    filter: drop-shadow(0 0 3px var(--orange));
}

/* CYFRA WYŚWIETLANA OBOK IKONY */
.global-bubble-text {
    font-size: 14px;
    font-weight: bold;
    color: var(--orange);
    text-shadow: 0 0 5px var(--orange);
}

/* DOLNY PANEL BACKUPU */
.backup-footer-row { display: flex; gap: 10px; margin-bottom: 12px; flex-shrink: 0; }
.btn-backup { flex: 1; background: rgba(0, 234, 255, 0.03); border: 1px solid rgba(0, 234, 255, 0.3); color: #a0e6ff; font-size: 12px; font-weight: bold; padding: 12px; border-radius: 8px; cursor: pointer; transition: all 0.3s ease; display: flex; align-items: center; justify-content: center; gap: 6px; text-transform: uppercase; }
.btn-backup:active { background: rgba(0, 234, 255, 0.15); }

/* AGRESYWNY ALARM NEONOWEJ CZERWIENI */
.btn-backup.needs-backup { background: rgba(255, 26, 26, 0.25) !important; border: 2px solid #ff1a1a !important; color: #ffffff !important; font-weight: 900; animation: pulse-emergency 1.2s infinite ease-in-out; }

/* ANIMACJA DIODY ALARMOWEJ */
@keyframes pulse-emergency {
    0% { box-shadow: 0 0 2px rgba(255, 26, 26, 0.4); background: rgba(255, 26, 26, 0.2); }
    50% { box-shadow: 0 0 16px rgba(255, 26, 26, 0.85); background: rgba(255, 26, 26, 0.4); border-color: #ff6666 !important; }
    100% { box-shadow: 0 0 2px rgba(255, 26, 26, 0.4); background: rgba(255, 26, 26, 0.2); }
}

/* ANIMACJA PULSUJĄCEGO TRÓJKĄTA */
.warning-triangle { display: inline-block; font-size: 14px; animation: breathe-triangle 1.2s infinite ease-in-out; margin-right: 2px; }
@keyframes breathe-triangle {
    0% { transform: scale(1); }
    50% { transform: scale(1.4); filter: drop-shadow(0 0 4px #ff1a1a); }
    100% { transform: scale(1); }
}

/* STOPKA */
.footer { flex-shrink: 0; background: var(--panel); padding: 15px; border-radius: 12px; border-top: 3px solid var(--green); }
.total-row { display: flex; justify-content: space-between; font-size: 16px; margin-bottom: 8px; }
.btn-nav { flex: 1; padding: 14px; border-radius: 8px; border: 1px solid var(--blue); background: rgba(0,234,255,0.05); color: var(--blue); font-weight: bold; cursor: pointer; position: relative; z-index: 10; -webkit-tap-highlight-color: transparent; transition: transform 0.1s ease, background 0.1s ease; }
.btn-nav:active { background: rgba(0, 234, 255, 0.25) !important; transform: scale(0.95); filter: drop-shadow(0 0 8px var(--blue)); }

/* PŁYNNE ZMIANY DLA PRZYCISKÓW W MODALU */
#editModal button { transition: transform 0.1s ease, background 0.1s ease; -webkit-tap-highlight-color: transparent; }

/* EFEKT KLIKNIĘCIA DLA ZIELONYCH (TYDEŃ, MIESIĄC) */
#editModal button[onclick*="'week'"]:active, 
#editModal button[onclick*="'month'"]:active { 
    background: rgba(0, 255, 166, 0.25) !important; 
    transform: scale(0.95); 
    filter: drop-shadow(0 0 8px var(--green)); 
}

/* EFEKT KLIKNIĘCIA DLA SOBÓT (BŁĘKITNY) */
#editModal button[onclick*="'saturday'"]:active { 
    background: rgba(0, 234, 255, 0.25) !important; 
    transform: scale(0.95); 
    filter: drop-shadow(0 0 8px var(--blue)); 
}

/* EFEKT KLIKNIĘCIA DLA NIEDZIEL (CZERWONY) */
#editModal button[onclick*="'sunday'"]:active { 
    background: rgba(255, 26, 26, 0.25) !important; 
    transform: scale(0.95); 
    filter: drop-shadow(0 0 8px var(--red)); 
}

/* EFEKT KLIKNIĘCIA DLA "ANULUJ" (BIAŁY/SZARY) */
#editModal button[onclick*="closeAllModals()"]:active { 
    background: rgba(255, 255, 255, 0.25) !important; 
    border: 1px solid #fff !important;
    transform: scale(0.95); 
    filter: drop-shadow(0 0 12px #fff) brightness(1.3);
}

/* EFEKT KLIKNIĘCIA DLA "ZAPISZ" (BŁĘKITNY) */
#editModal button[onclick*="saveDay()"]:active { 
    background: rgba(0, 234, 255, 0.4) !important; 
    transform: scale(0.95); 
    filter: drop-shadow(0 0 8px var(--blue)); 
}

/* MODALE (PŁYNNE UNOWOCZEŚNIONE POJAWIANIE SIĘ I ZNIKANIE) */
.modal-overlay { 
    display: none; 
    position: fixed; 
    top: 0; left: 0; width: 100%; height: 100%; 
    background: rgba(0,0,0,0); 
    z-index: 150; 
    transition: background 0.2s ease;
}
.modal-overlay.show {
    display: block;
    background: rgba(0,0,0,0.85);
}

#editModal {
    display: none; 
    position: fixed; 
    top: 50%; 
    left: 50%; 
    /* Domyślnie schowany, lekko przesunięty w dół i zmniejszony */
    transform: translate(-50%, -40%) scale(0.9);
    opacity: 0;
    z-index: 200;
    width: 90%;
    max-width: 380px;
    padding: 20px;
    border-radius: 12px;
    border: 2px solid var(--blue);
    box-shadow: 0 0 30px rgba(0, 234, 255, 0.2);
    box-sizing: border-box;
    max-height: 90vh;
    overflow-y: auto;
    background: var(--panel);
    /* Przejście dla wyłaniania */
    transition: transform 0.22s cubic-bezier(0.34, 1.4, 0.64, 1), opacity 0.22s ease-out;
}

#noteModalContent {
    white-space: pre-wrap;
    word-break: break-word;
    margin-bottom: 20px;
    line-height: 1.5;
    color: #fff;
    font-size: 14px;
    text-align: left;
}

#editModal.active-render {
    display: block !important;
}
#editModal.show {
    transform: translate(-50%, -50%) scale(1) !important;
    opacity: 1 !important;
}

/* PŁYNNE EMERGENCE DLA NOTATKI */
#noteModal { 
    display: none; 
    position: fixed; 
    top: 50%; 
    left: 50%; 
    transform: translate(-50%, -40%) scale(0.9); 
    opacity: 0;
    background: var(--panel); 
    padding: 22px; 
    border: 2px solid var(--orange); 
    z-index: 201; 
    border-radius: 15px; 
    width: 85%; 
    max-width: 320px; 
    box-shadow: 0 0 40px rgba(255, 153, 0, 0.25); 
    transition: transform 0.22s cubic-bezier(0.34, 1.4, 0.64, 1), opacity 0.22s ease-out;
}
#noteModal.active-render {
    display: block !important;
}
#noteModal.show {
    transform: translate(-50%, -50%) scale(1) !important;
    opacity: 1 !important;
}

.time-row { display: flex; gap: 10px; margin-bottom: 5px; }
.time-row input { background: #000; border: 1px solid #444; color: white; padding: 10px; border-radius: 6px; width: 100%; text-align: center; font-size: 15px; }
.modal-label { display: block; font-size: 11px; color: var(--blue); margin-bottom: 3px; text-transform: uppercase; }
.break-label { display: block; font-size: 10px; color: var(--green); margin: 8px 0 2px 0; font-weight: bold; }
.note-textarea { width: 100%; background: #000; color: #fff; border: 1px solid #444; padding: 10px; border-radius: 6px; box-sizing: border-box; font-family: Arial; font-size: 13px; resize: none; height: 50px; margin-bottom: 10px; }

/* CENTROWANIE I OGRANICZENIE SZEROKOŚCI POLA STAWKI */
.rate-input-wrapper { display: flex; flex-direction: column; align-items: center; margin-bottom: 15px; }
.rate-input-wrapper input { width: 100%; max-width: 120px; background: #000; color: #fff; border: 1px solid #444; padding: 10px; border-radius: 6px; text-align: center; font-size: 15px; }
</style>
</head>
<body>

<div class="container">
    <div class="header">
        <div id="dayLabel">--</div>
        <div class="clock" id="clock">00:00:00</div>
        
        <div class="month-title-container">
            <div id="monthTitle">---</div>
            
            <div id="globalMonthBubbleWrapper" class="global-bubble-wrapper">
                <svg class="global-bubble-svg" viewBox="0 0 24 20">
                    <path d="M2 5 C2 2, 4 2, 7 2 L17 2 C20 2, 22 2, 22 5 L22 13 C22 16, 20 16, 17 16 L7 16 L3 19 L3 16 C2 16, 2 15, 2 13 Z" fill="#0b0f14" stroke="var(--orange)" stroke-width="1.8" stroke-linejoin="round"/>
                    <line x1="6" y1="6" x2="18" y2="6" stroke="var(--orange)" stroke-width="1.5" stroke-linecap="round"/>
                    <line x1="6" y1="9.5" x2="18" y2="9.5" stroke="var(--orange)" stroke-width="1.5" stroke-linecap="round"/>
                    <line x1="6" y1="13" x2="14" y2="13" stroke="var(--orange)" stroke-width="1.5" stroke-linecap="round"/>
                </svg>
                <span id="globalBubbleCount" class="global-bubble-text">0</span>
            </div>
        </div>
        
        <div id="weather-info">Pobieram lokalizację...</div>
        
        <div class="progress-container"><div id="progress-bar"></div></div>
        <div class="todayWork" id="todayWork">--</div>
        <div class="break-timer" id="breakTimer"></div>
    </div>

    <div class="table-wrapper" id="tableWrapper">
        <table>
            <thead><tr><th colspan="2" style="width: 45%;">Dzień</th><th>H</th><th>PLN</th><th>⚙️</th></tr></thead>
            <tbody id="calendarBody"></tbody>
        </table>
    </div>

    <div class="backup-footer-row">
        <button class="btn-backup" id="exportBtn" onclick="exportData()"><span id="exportIcon" style="display:inline-block;">📤</span> <span id="exportText">EKSPORT</span></button>
        <button class="btn-backup" onclick="document.getElementById('importFile').click()">📥 IMPORT</button>
        <input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(event)">
    </div>

    <div class="footer">
        <div class="total-row"><span>Suma godzin:</span><span id="totalHours" style="color:var(--green);">0.00</span></div>
        <div class="total-row"><span>Zarobek:</span><span id="totalMoney" style="color:var(--green);">0 zł</span></div>
        <div style="display:flex; gap:12px; margin-top:10px;">
            <button class="btn-nav" onclick="changeMonth(-1)">◀ POPRZEDNI</button>
            <button class="btn-nav" onclick="changeMonth(1)">NASTĘPNY ▶</button>
        </div>
    </div>
</div>

<div id="toast" class="toast-container"></div>

<div class="modal-overlay" id="overlay" onclick="closeAllModals()"></div>

<div id="editModal">
    <h3 id="modalTitle" style="margin:0 0 15px 0; color:var(--blue); text-align:center;">Ustawienia</h3>
    
    <div class="rate-input-wrapper">
        <span class="modal-label">Stawka PLN/h:</span>
        <input type="number" id="editRate">
    </div>
    
    <span class="modal-label" style="font-weight:bold;">Godziny Pracy:</span>
    <div class="time-row"><input type="time" id="workStart"> <input type="time" id="workEnd"></div>
    
    <span class="modal-label" style="margin-top: 10px;">📝 Uwagi / Notatki do dnia:</span>
    <textarea id="dayNote" class="note-textarea" placeholder="Np. dzień wolny, święto itp."></textarea>
    
    <div style="margin-top:5px; padding-top:10px; border-top:1px solid #444;">
        <span class="break-label">PRZERWA 1:</span>
        <div class="time-row"><input type="time" id="editB1S"><input type="time" id="editB1E"></div>
        <span class="break-label">PRZERWA 2:</span>
        <div class="time-row"><input type="time" id="editB2S"><input type="time" id="editB2E"></div>
        <span class="break-label">PRZERWA 3:</span>
        <div class="time-row"><input type="time" id="editB3S"><input type="time" id="editB3E"></div>
    </div>

    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px; margin:15px 0 15px 0;">
        <button onclick="applyToBulk('week')" style="background:#222; color:var(--green); border:1px solid var(--green); padding:10px; border-radius:6px; font-size:11px;">KOPIUJ TYDZIEŃ</button>
        <button onclick="applyToBulk('month')" style="background:#222; color:var(--green); border:1px solid var(--green); padding:10px; border-radius:6px; font-size:11px;">KOPIUJ MIESIĄC</button>
        <button onclick="applyToBulk('saturday')" style="background:#222; color:var(--blue); border:1px solid var(--blue); padding:10px; border-radius:6px; font-size:11px;">KOPIUJ SOBOTY</button>
        <button onclick="applyToBulk('sunday')" style="background:#222; color:var(--red); border:1px solid var(--red); padding:10px; border-radius:6px; font-size:11px;">KOPIUJ NIEDZIELE</button>
    </div>
    
    <div style="display:flex; gap:10px;">
        <button style="flex:1; padding:12px; background:none; color:white; border:1px solid #666; border-radius:8px;" onclick="closeAllModals()">Anuluj</button>
        <button style="flex:1; padding:12px; background:var(--blue); color:black; border:none; border-radius:8px; font-weight:bold;" onclick="saveDay()">Zapisz</button>
    </div>
    <div style="text-align: center; margin-top: 15px; padding-top: 10px; border-top: 1px solid #444; width: 100%;">
        <span style="color: #666; font-size: 11px; font-family: monospace; letter-spacing: 1px;">
            WERSJA: 1.0.0
        </span>
    </div>
</div>

<div id="noteModal">
    <h3 class="note-modal-title" id="noteModalTitle">Notatka</h3>
    <div class="note-modal-content" id="noteModalContent"></div>
    <button style="width:100%; padding:12px; background:var(--orange); color:black; border:none; border-radius:8px; font-weight:bold; cursor:pointer;" onclick="closeAllModals()">ZAMKNIJ</button>
</div>

<script>
const monthNames = ["Styczeń","Luty","Marzec","Kwiecień","Maj","Czerwiec","Lipiec","Sierpień","Wrzesień","Październik","Listopad","Grudzień"];
const dayNamesLong = ["Niedziela", "Poniedziałek", "Wtorek", "Środa", "Czwartek", "Piątek", "Sobota"];

let viewDate = new Date();
let daysData = {};
let db = null;
let currentEditingKey = null;

const settingsIcon = `
<svg class="font-sliders-icon" viewBox="0 0 24 24">
    <path class="slider-track" d="M3 6h18" stroke-width="2" stroke-linecap="round"/>
    <circle class="slider-dot line-top" cx="9" cy="6" r="2.5"/>
    <path class="slider-track" d="M3 12h18" stroke-width="2" stroke-linecap="round"/>
    <circle class="slider-dot line-mid" cx="15" cy="12" r="2.5"/>
    <path class="slider-track" d="M3 18h18" stroke-width="2" stroke-linecap="round"/>
    <circle class="slider-dot line-bot" cx="9" cy="18" r="2.5"/>
</svg>`;

function getKey(date) { return date.getFullYear() + "-" + (date.getMonth() + 1) + "-" + date.getDate(); }

function showToast(message, type = "success") {
    const toast = document.getElementById("toast");
    toast.textContent = message;
    toast.className = "toast-container show";
    if (type === "success") toast.classList.add("toast-success");
    if (type === "error") toast.classList.add("toast-error");

    setTimeout(() => {
        toast.classList.remove("show");
    }, 3000);
}

function checkBackupStatus() {
    const lastBackup = localStorage.getItem("last_backup_date");
    const exportBtn = document.getElementById("exportBtn");
    const exportIcon = document.getElementById("exportIcon");
    const now = new Date();
    
    let totalHoursLast7Days = 0;
    for (let i = 0; i < 7; i++) {
        let checkDate = new Date();
        checkDate.setDate(now.getDate() - i);
        let k = getKey(checkDate);
        if (daysData[k]) {
            totalHoursLast7Days += calculateWork(checkDate, daysData[k]);
        }
    }

    if (totalHoursLast7Days <= 0) {
        exportBtn.classList.remove("needs-backup");
        exportIcon.innerHTML = "📤";
        return;
    }

    let triggerAlert = false;

    if (!lastBackup) {
        triggerAlert = true;
    } else {
        const diffDays = Math.floor((now - new Date(lastBackup)) / (1000 * 60 * 60 * 24));
        if (diffDays >= 7) {
            triggerAlert = true;
        }
    }

    if (now.getDay() === 6) {
        const todayKey = getKey(now);
        const todayData = daysData[todayKey];
        if (todayData && todayData.work !== 0 && todayData.end) {
            const endParts = todayData.end.split(":").map(Number);
            const workEndTime = new Date();
            workEndTime.setHours(endParts[0], endParts[1], 0, 0);
            
            if (now >= workEndTime) {
                if (!lastBackup || new Date(lastBackup) < workEndTime) {
                    triggerAlert = true;
                }
            }
        }
    }

    if (triggerAlert) {
        exportBtn.classList.add("needs-backup");
        exportIcon.innerHTML = `<span class="warning-triangle">⚠️</span>`;
    } else {
        exportBtn.classList.remove("needs-backup");
        exportIcon.innerHTML = "📤";
    }
}

function initDB() {
    return new Promise((resolve) => {
        if (navigator.storage && navigator.storage.persist) {
            navigator.storage.persist().then(persistent => {
                if (persistent) console.log("Pamięć zabezpieczona.");
            });
        }

        const req = indexedDB.open("WORK_DATA_DB", 1);
        req.onupgradeneeded = e => {
            e.target.result.createObjectStore("days", { keyPath: "key" });
        };
        req.onsuccess = e => {
            db = e.target.result;
            resolve();
        };
        req.onerror = e => {
            console.error("Błąd IndexedDB:", e);
            resolve();
        };
    });
}

function saveToDB(key, data) {
    if (!db) return;
    const tx = db.transaction("days", "readwrite");
    tx.objectStore("days").put({ key: key, ...data });
}

function loadFromDB() {
    return new Promise((resolve) => {
        if (!db) return resolve();
        const req = db.transaction("days", "readonly").objectStore("days").getAll();
        req.onsuccess = () => {
            daysData = {};
            req.result.forEach(item => {
                const { key, ...rest } = item;
                daysData[key] = rest;
            });
            resolve();
        };
        req.onerror = () => resolve();
    });
}

function exportData() {
    if (!db) return showToast("Baza danych nie jest gotowa.", "error");
    const tx = db.transaction("days", "readonly");
    const store = tx.objectStore("days");
    const req = store.getAll();

    req.onsuccess = () => {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(req.result, null, 2));
        const downloadAnchor = document.createElement('a');
        downloadAnchor.setAttribute("href", dataStr);
        downloadAnchor.setAttribute("download", `czas_pracy_kopia_${new Date().toISOString().slice(0,10)}.json`);
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();
        
        localStorage.setItem("last_backup_date", new Date().toISOString());
        checkBackupStatus();
        showToast("Kopia zapasowa została pobrana!");
    };
}

function importData(event) {
    const file = event.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(e) {
        try {
            const importedItems = JSON.parse(e.target.result);
            if (!Array.isArray(importedItems)) throw new Error("Nieprawidłowy format pliku.");

            const tx = db.transaction("days", "readwrite");
            const store = tx.objectStore("days");

            importedItems.forEach(item => {
                if (item.key) store.put(item);
            });

            tx.oncomplete = () => {
                showToast("Dane zostały pomyślnie przywrócone!");
                loadFromDB().then(() => {
                    render();
                    checkBackupStatus();
                });
            };
        } catch (err) {
            showToast("Błąd importu pliku.", "error");
        }
    };
    reader.readAsText(file);
    event.target.value = "";
}

    svgIcon.classList.add('animating');

    setTimeout(() => {

}

function openEdit(key) {

    document.getElementById("modalTitle").textContent = "Ustaw: " + key;

    for(let i=1; i<=3; i++) {

function openNoteModal(key) {
    if (!daysData[key] || !daysData[key].note) return;
    
    // Zmiana formatu z 2026-5-20 na 20.05.2026
    const parts = key.split("-");

    const noteModal = document.getElementById("noteModal");
    
    overlay.style.display = "block";
    noteModal.classList.add("active-render");
    
    setTimeout(() => {
        overlay.classList.add("show");
        noteModal.classList.add("show");

function closeAllModals() { 
    const overlay = document.getElementById("overlay");
    const editModal = document.getElementById("editModal");
    const noteModal = document.getElementById("noteModal");
    
    overlay.classList.remove("show");
    editModal.classList.remove("show");
    noteModal.classList.remove("show");

    setTimeout(() => {

        if (!noteModal.classList.contains("show")) noteModal.classList.remove("active-render");

function saveDay() {
    const key = currentEditingKey;
    if(!daysData[key]) daysData[key] = {work:1};
    daysData[key].rate = Number(document.getElementById("editRate").value);
    daysData[key].start = document.getElementById("workStart").value;
    daysData[key].end = document.getElementById("workEnd").value;
    daysData[key].note = document.getElementById("dayNote").value;
    daysData[key].customBreaks = [];
    for(let i=1; i<=3; i++) {
        let s = document.getElementById(`editB${i}S`).value, e = document.getElementById(`editB${i}E`).value;
        if(s && e) daysData[key].customBreaks.push([s, e]);
    }
    saveToDB(key, daysData[key]);
    closeAllModals(); render();
    checkBackupStatus();
    showToast("Zapisano ustawienia dnia.");
}

function applyToBulk(mode) {
    const rate = Number(document.getElementById("editRate").value);
    const start = document.getElementById("workStart").value;
    const end = document.getElementById("workEnd").value;
    const breaks = [];
    for(let i=1; i<=3; i++) {
        let s = document.getElementById(`editB${i}S`).value, e = document.getElementById(`editB${i}E`).value;
        if(s && e) breaks.push([s, e]);
    }
    const m = viewDate.getMonth(), y = viewDate.getFullYear();
    const lastDay = new Date(y, m + 1, 0).getDate();
    let targets = [];

    if(mode === 'month') { 
        for(let d=1; d<=lastDay; d++) targets.push(new Date(y, m, d)); 
    }
    else if(mode === 'saturday') {
        for(let d=1; d<=lastDay; d++) {
            let date = new Date(y, m, d);
            if(date.getDay() === 6) targets.push(date);
        }
    }
    else if(mode === 'sunday') {
        for(let d=1; d<=lastDay; d++) {
            let date = new Date(y, m, d);
            if(date.getDay() === 0) targets.push(date);
        }
    }
    else {
        const baseDate = new Date(currentEditingKey);
        let dw = baseDate.getDay();
        let diff = (dw === 0 ? -6 : 1 - dw);
        let mon = new Date(baseDate); mon.setDate(baseDate.getDate() + diff);
        for(let i=0; i<7; i++) {
            let d = new Date(mon); d.setDate(mon.getDate() + i);
            if(d.getMonth() === m) targets.push(d);
        }
    }

    targets.forEach(date => {
        let k = getKey(date);
        if(!daysData[k]) daysData[k] = {work: 1}; 
        daysData[k].rate = rate; daysData[k].start = start; daysData[k].end = end; daysData[k].customBreaks = breaks;
        saveToDB(k, daysData[k]);
    });
    closeAllModals(); render();
    checkBackupStatus();
    showToast("Zastosowano zmiany masowe.");
}

function calculateWork(date, dayObj) {
    if (!dayObj || dayObj.work === 0) return 0;
    let sTime = dayObj.start || "00:00", eTime = dayObj.end || "00:00";
    if (sTime === eTime) return 0;
    let now = new Date();
    let start = new Date(date); start.setHours(...sTime.split(":").map(Number),0,0);
    let end = new Date(date); end.setHours(...eTime.split(":").map(Number),0,0);
    let finish;
    if (date.toDateString() === now.toDateString()) {
        if (now < start) return 0;
        finish = now > end ? end : now;
    } else { finish = date > now ? null : end; }
    if (!finish || finish <= start) return 0;
    let totalMs = finish - start;
    (dayObj.customBreaks || []).forEach(b => {
        let bs = new Date(date); bs.setHours(...b[0].split(":").map(Number),0,0);
        let be = new Date(date); be.setHours(...b[1].split(":").map(Number),0,0);
        let overlap = Math.min(finish, be) - Math.max(start, bs);
        if (overlap > 0) totalMs -= overlap;
    });
    return Math.max(0, totalMs / 3600000);
}

function render() {
    const tbody = document.getElementById("calendarBody");
    tbody.innerHTML = "";
    let m = viewDate.getMonth(), y = viewDate.getFullYear();
    document.getElementById("monthTitle").textContent = monthNames[m] + " " + y;
    let lastDay = new Date(y, m+1, 0).getDate();
    let totH = 0, totM = 0, wH = 0, wM = 0;
    let todayKey = getKey(new Date());
    
    let notesCount = 0;

    for(let d=1; d<=lastDay; d++) {
        let date = new Date(y, m, d), dw = date.getDay(), key = getKey(date);
        if(!daysData[key]) daysData[key] = {rate:80, work:1, start:"00:00", end:"00:00", customBreaks:[], note:""};
        let h = calculateWork(date, daysData[key]), mv = h * (daysData[key].rate || 80);
        totH += h; totM += mv; wH += h; wM += mv;
        let tr = document.createElement("tr");
        if(dw === 6) tr.className = "saturday";
        if(dw === 0) tr.className = "sunday";
        
        if(key === todayKey) {
            tr.classList.add("today");
            tr.id = "today-row";
        }
        if(daysData[key].work === 0) tr.className += " dayOff";
        
        let neonBubbleElement = `<div style="width:20px; height:17px; flex-shrink:0;"></div>`;
        if (daysData[key].note && daysData[key].note.trim() !== "") {
            notesCount++;
            neonBubbleElement = `
                <svg class="neon-bubble-svg" viewBox="0 0 24 20" title="${daysData[key].note.replace(/"/g, '&quot;')}">
                    <path d="M2 5 C2 2, 4 2, 7 2 L17 2 C20 2, 22 2, 22 5 L22 13 C22 16, 20 16, 17 16 L7 16 L3 19 L3 16 C2 16, 2 15, 2 13 Z" fill="#000" stroke="var(--orange)" stroke-width="1.8" stroke-linejoin="round"/>
                    <line x1="6" y1="6" x2="18" y2="6" stroke="var(--orange)" stroke-width="1.5" stroke-linecap="round"/>
                    <line x1="6" y1="9.5" x2="18" y2="9.5" stroke="var(--orange)" stroke-width="1.5" stroke-linecap="round"/>
                    <line x1="6" y1="13" x2="14" y2="13" stroke="var(--orange)" stroke-width="1.5" stroke-linecap="round"/>
                </svg>
            `;
        }

        const dayNameStr = date.toLocaleDateString('pl-PL',{weekday:'short'});
        
        tr.innerHTML = `
            <td colspan="2">
                <div class="date-row-container">
                    <span class="date-num">${d}</span>
                    ${neonBubbleElement}
                    <span class="date-day-name">${dayNameStr}</span>
                </div>
            </td>
            <td>${h.toFixed(2)}</td>
            <td>${mv.toFixed(0)}</td>
            <td onclick="triggerSettingsWithAnimation(this, '${key}')">${settingsIcon}</td>
        `;
        
        tr.onclick = (e) => { 
            if(e.target.closest('.font-sliders-icon') || e.target.closest('td').cellIndex === 4) return; 
            
            if(e.target.classList.contains('neon-bubble-svg') || e.target.closest('.neon-bubble-svg')) {
                openNoteModal(key);
                return;
            }

            daysData[key].work = daysData[key].work ? 0 : 1; 
            saveToDB(key, daysData[key]); 
            render(); 
            checkBackupStatus();
        };
        tbody.appendChild(tr);
        if(dw === 0 || d === lastDay) {
            tbody.insertAdjacentHTML('beforeend', `<tr class="weekSummary"><td colspan="2">TYDZIEŃ</td><td>${wH.toFixed(2)}</td><td colspan="2">${wM.toFixed(0)} zł</td></tr>`);
            wH = 0; wM = 0;
        }
    }
    
    const globalWrapper = document.getElementById("globalMonthBubbleWrapper");
    const globalCountText = document.getElementById("globalBubbleCount");
    
    if (notesCount > 0) {
        globalCountText.textContent = notesCount;
        globalWrapper.style.display = "flex";
    } else {
        globalWrapper.style.display = "none";
    }

    document.getElementById("totalHours").textContent = totH.toFixed(2);
    document.getElementById("totalMoney").textContent = totM.toFixed(0) + " zł";
}

function scrollToToday() {
    setTimeout(() => {
        const todayRow = document.getElementById("today-row");
        if (todayRow) {
            todayRow.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
    }, 300);
}

function formatTimeLeft(ms) {
    let s = Math.floor(ms / 1000); let m = Math.floor(s / 60); let h = Math.floor(m / 60);
    s %= 60; m %= 60;
    return (h > 0 ? h + "h " : "") + (m > 0 || h > 0 ? m + "m " : "") + s + "s";
}

function changeMonth(step) { viewDate.setMonth(viewDate.getMonth() + step); render(); }

function updateWeather() {
    const weatherInfo = document.getElementById('weather-info');

    const getForecast = (lat, lon, cityName = "") => {
        if (!cityName) {
            fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}`)
                .then(res => res.json())
                .then(geo => {
                    const city = geo.address.city || geo.address.town || geo.address.village || "Twoja lokalizacja";
                    fetchWeather(lat, lon, city);
                })
                .catch(() => fetchWeather(lat, lon, "Twoja pozycja"));
        } else {
            fetchWeather(lat, lon, cityName);
        }
    };

    const fetchWeather = (lat, lon, city) => {
        fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true&hourly=relativehumidity_2m`)
            .then(res => res.json())
            .then(weather => {
                const temp = Math.round(weather.current_weather.temperature);
                const wind = Math.round(weather.current_weather.windspeed);
                const hourIndex = new Date().getHours();
                const hum = weather.hourly.relativehumidity_2m[hourIndex];
                
                weatherInfo.innerHTML = `📍 ${city} | 🌡️ ${temp}°C | 💧 ${hum}% | 💨 ${wind} km/h`;
            })
            .catch(() => { weatherInfo.innerText = "Błąd pogody"; });
    };

    if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
            (pos) => getForecast(pos.coords.latitude, pos.coords.longitude),
            () => {
                fetch('https://ipapi.co/json/')
                    .then(res => res.json())
                    .then(loc => getForecast(loc.latitude, loc.longitude, loc.city));
            },
            { enableHighAccuracy: true, timeout: 5000 }
        );
    }
}

setInterval(() => {
    let now = new Date();
    document.getElementById("clock").textContent = now.toLocaleTimeString("pl-PL");
    document.getElementById("dayLabel").textContent = dayNamesLong[now.getDay()];
    let key = getKey(now);
    let dObj = daysData[key];
    let breakInfo = "";
    
    if(now.getSeconds() === 0) {
        checkBackupStatus();
    }

    if(dObj && dObj.work !== 0 && dObj.start !== dObj.end) {
        let s = new Date(); s.setHours(...dObj.start.split(":").map(Number),0,0);
        let e = new Date(); e.setHours(...dObj.end.split(":").map(Number),0,0);

        if(now >= s && now <= e) {
            document.getElementById("progress-bar").style.width = ((now - s) / (e - s) * 100) + "%";
            document.getElementById("todayWork").textContent = `Dziś: ${calculateWork(now, dObj).toFixed(2)}h`;
        } else if (now > e) {
            document.getElementById("progress-bar").style.width = "100%";
            document.getElementById("todayWork").innerHTML = '<span style="color:#ffd700;">FAJRANT! 🍻</span>';
        } else if (now < s) {
            document.getElementById("progress-bar").style.width = "0%";
            document.getElementById("todayWork").innerHTML = `<span style="color:var(--blue);">Start za: ${formatTimeLeft(s - now)}</span>`;
        }

        let currentBreak = null;
        let nextBreak = null;
        (dObj.customBreaks || []).forEach(b => {
            let bs = new Date(); bs.setHours(...b[0].split(":").map(Number),0,0);
            let be = new Date(); be.setHours(...b[1].split(":").map(Number),0,0);
            if(now >= bs && now < be) currentBreak = be - now;
            else if (bs > now && (!nextBreak || bs < nextBreak)) nextBreak = bs;
        });

        if(currentBreak) {
            breakInfo = `<span style="color:var(--green)">PRZERWA! (zostało: ${formatTimeLeft(currentBreak)})</span>`;
        } else if(nextBreak && now >= s && now <= e) {
            breakInfo = `Przerwa za: ${formatTimeLeft(nextBreak - now)}`;
        }
    } else {
        document.getElementById("progress-bar").style.width = "0%";
        document.getElementById("todayWork").textContent = "--";
    }
    document.getElementById("breakTimer").innerHTML = breakInfo;
}, 1000);

initDB().then(() => {
    loadFromDB().then(() => {
        render();
        updateWeather();
        checkBackupStatus();
        scrollToToday();
        setInterval(updateWeather, 900000);
    });
});
